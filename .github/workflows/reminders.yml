# Hourly trigger for evening reminder pushes. The backend decides who is
# actually due (per-user timezone + chosen hour + already-wrote-tonight
# check); this job just rings the bell.
#
# Requires a repo secret named CRON_SECRET matching the backend's
# CRON_SECRET env var (Settings → Secrets and variables → Actions).
#
# NOTE: GitHub pauses scheduled workflows after ~60 days without repo
# activity — a commit re-enables them.
#
# Schedule minute: KEEP THIS AT :00 UNLESS YOU HAVE EVIDENCE.
#
# GitHub docs say schedules are delayed most at the top of the hour, so on
# 2026-08-27 this was moved to :07 to reduce the ~20 minute lag. The result was
# far worse: scheduled runs collapsed from ~23/day to 1-2/day, and the 18:00
# reminder window was missed entirely on 08-27 and 08-28. Reverted to :00,
# which empirically ran ~17-23 times a day.
#
# Even at :00 this is unreliable — 2026-08-22 also missed the window. GitHub
# cron is a trigger, not a clock. The real fix for reminders that must actually
# arrive is an external scheduler (e.g. cron-job.org) calling
# POST /api/notifications/dispatch with the same x-cron-secret header. No
# backend change is needed to switch; only this file becomes redundant.

name: Evening reminders

on:
  schedule:
    - cron: "0 * * * *" # hourly (UTC). See the note above before changing.
  workflow_dispatch: {} # manual "Run workflow" button for testing

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder dispatch
        run: |
          curl -sS --fail-with-body -X POST \
            "https://custodian-coral.vercel.app/api/notifications/dispatch" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
